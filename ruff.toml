# ==================================================================
# Python 格式化 / lint 基线（唯一真本）
# ------------------------------------------------------------------
# `ruff format` 负责排版，`ruff check` 负责 lint，一个工具两件事。
# 镜像里已预装 ruff（见 images/scripts/install/python.sh）。
#
# 本文件是门禁文件，见 scripts/gate-files.txt。
# ==================================================================
target-version = "py312"

# 只格式化 Python 源码。
# ruff 0.17 起会连带格式化 Markdown 里 ```python 代码块 —— 实测 python/ 下
# 78 份 .md 全被扫进来（168 = 90 个 .py + 78 个 .md）。这有两个问题：
#   1) 超出「格式化源码」的范围，且会让格式化 PR 混进大量文档 diff
#   2) 文档里的代码块是给人读的，常刻意演示反例（可变默认参数、裸 except），
#      被自动「整理」后反例就不成立了
include = ["*.py", "*.pyi"]

# 与 .editorconfig / .clang-format 的 100 列一致（ruff 默认 88）
line-length = 100

[format]
# 仓库现有代码统一用双引号
quote-style = "double"
indent-style = "space"

[lint]
# 只开不会误伤教学用例的规则；教学用例刻意演示反例（如可变默认参数），
# 所以这里不放行 E501 之外的风格类规则。
select = ["E", "F", "W"]
ignore = ["E501"]
