name: images

# ==================================================================
# 镜像构建流水线
# ------------------------------------------------------------------
# 分 job 并行的正确形态（这一点很容易写错）：
#   1) base+tool 一个 job 先出，tag 用「本次 commit 的 sha」
#   2) 7 个语言 job needs 上面，并行构建，FROM tool:<sha>
#   3) all / runtime 最后收口
# 严禁让语言 job FROM tool:latest —— 那样改了 tool 层，
# 语言镜像还在用上次 CI 留下的旧层，镜像里两个版本的工具并存且不报错。
# ==================================================================

on:
  # 只作为可复用工作流被 ci.yml 调用，不再自带触发条件 ——
  # 自带 push 触发会与 ci.yml 里的调用重复构建同一批镜像。
  # 复用而不是复制：改一行构建逻辑要改两个地方，是最容易漂的一类重复。
  workflow_call:
  # 手动触发：只想重建镜像、不跑用例时用
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  base-tool:
    name: base + tool
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 打印版本真本
        run: |
          echo "=== images/versions.env ===" 
          grep -v '^\s*#' images/versions.env | grep -v '^\s*$' || true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build base
        run: |
          # buildx 的 --build-arg-file 在老版本插件上不存在（unknown flag）→ 自己解析
          mapfile -t BARGS < <(bash images/scripts/build-args.sh)
          # CI runner 在境外：把 APT_MIRROR 置空，让 setup-apt.sh 保持官方源
          # （镜像里固化国内源的话，Azure 上 apt 会慢到超时）
          BARGS=("${BARGS[@]/APT_MIRROR=*/APT_MIRROR=}")
          docker buildx build --load \
            --file images/base/Dockerfile \
            "${BARGS[@]}" \
            --tag "$REGISTRY/devbox-base:$IMAGE_TAG" \
            --cache-from "type=gha,scope=base" \
            --cache-to "type=gha,mode=max,scope=base" \
            .
          docker run --rm "$REGISTRY/devbox-base:$IMAGE_TAG" bash -lc 'echo base-ok'
          size="$(docker image inspect "$REGISTRY/devbox-base:$IMAGE_TAG" --format '{{.Size}}')"
          printf 'layer\tsize_bytes\nbase\t%s\n' "$size" > /tmp/metrics-base.tsv
          bash scripts/budget-check.sh --metrics /tmp/metrics-base.tsv --layers base
          docker push "$REGISTRY/devbox-base:$IMAGE_TAG"

      - name: publish base latest
        if: github.event_name != 'pull_request'
        run: |
          docker tag "$REGISTRY/devbox-base:$IMAGE_TAG" "$REGISTRY/devbox-base:latest"
          docker push "$REGISTRY/devbox-base:latest"

      - name: build tool
        run: |
          # buildx 的 --build-arg-file 在老版本插件上不存在（unknown flag）→ 自己解析
          mapfile -t BARGS < <(bash images/scripts/build-args.sh)
          docker buildx build --load \
            --file images/tool/Dockerfile \
            --build-arg "BASE_IMAGE=$REGISTRY/devbox-base:$IMAGE_TAG" \
            "${BARGS[@]}" \
            --tag "$REGISTRY/devbox-tool:$IMAGE_TAG" \
            --cache-from "type=gha,scope=tool" \
            --cache-to "type=gha,mode=max,scope=tool" \
            .
          docker run --rm "$REGISTRY/devbox-tool:$IMAGE_TAG" bash -lc 'gdb --version | head -1'
          size="$(docker image inspect "$REGISTRY/devbox-tool:$IMAGE_TAG" --format '{{.Size}}')"
          printf 'layer\tsize_bytes\ntool\t%s\n' "$size" > /tmp/metrics-tool.tsv
          bash scripts/budget-check.sh --metrics /tmp/metrics-tool.tsv --layers tool
          docker push "$REGISTRY/devbox-tool:$IMAGE_TAG"

      - name: publish tool latest
        if: github.event_name != 'pull_request'
        run: |
          docker tag "$REGISTRY/devbox-tool:$IMAGE_TAG" "$REGISTRY/devbox-tool:latest"
          docker push "$REGISTRY/devbox-tool:latest"

      - name: 记录体积
        run: |
          mkdir -p metrics
          printf 'layer\tsize_bytes\n' > metrics/images-$IMAGE_TAG.tsv
          for l in base tool; do
            s=$(docker image inspect "$REGISTRY/devbox-$l:$IMAGE_TAG" --format '{{.Size}}')
            printf '%s\t%s\n' "$l" "$s" >> metrics/images-$IMAGE_TAG.tsv
          done
          column -t metrics/images-$IMAGE_TAG.tsv

      - uses: actions/upload-artifact@v4
        with:
          name: image-sizes-base-tool
          path: metrics/images-*.tsv

  lang:
    name: lang-${{ matrix.lang }}
    needs: base-tool
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        lang: [cpp, go, rust, shell, python, java, vue]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build ${{ matrix.lang }}
        run: |
          # buildx 的 --build-arg-file 在老版本插件上不存在（unknown flag）→ 自己解析
          mapfile -t BARGS < <(bash images/scripts/build-args.sh)
          docker buildx build --load \
            --file "images/${{ matrix.lang }}/Dockerfile" \
            --build-arg "BASE_IMAGE=$REGISTRY/devbox-tool:$IMAGE_TAG" \
            "${BARGS[@]}" \
            --tag "$REGISTRY/devbox-${{ matrix.lang }}:$IMAGE_TAG" \
            --cache-from "type=gha,scope=${{ matrix.lang }}" \
            --cache-to "type=gha,mode=max,scope=${{ matrix.lang }}" \
            .

      # 关键门禁：镜像必须能真跑 hello 用例，静态检查全绿不算数
      - name: smoke test（真跑 hello 用例）
        run: |
          IMG="$REGISTRY/devbox-${{ matrix.lang }}:$IMAGE_TAG"
          docker run --rm \
            -e "HOST_UID=$(id -u)" -e "HOST_GID=$(id -g)" \
            -v "$PWD:/work" -w "/work/${{ matrix.lang }}/examples/L0-hello" "$IMG" bash run.sh

      - name: 记录体积 + 推送
        run: |
          IMG="$REGISTRY/devbox-${{ matrix.lang }}:$IMAGE_TAG"
          s=$(docker image inspect "$IMG" --format '{{.Size}}')
          mkdir -p metrics
          { printf 'layer\tsize_bytes\n'; printf '%s\t%s\n' "${{ matrix.lang }}" "$s"; } \
            > "metrics/images-${{ matrix.lang }}-$IMAGE_TAG.tsv"
          column -t "metrics/images-${{ matrix.lang }}-$IMAGE_TAG.tsv"
          bash scripts/budget-check.sh \
            --metrics "metrics/images-${{ matrix.lang }}-$IMAGE_TAG.tsv" \
            --layers "${{ matrix.lang }}"
          docker push "$IMG"

      - name: publish ${{ matrix.lang }} latest
        if: github.event_name != 'pull_request'
        run: |
          IMG="$REGISTRY/devbox-${{ matrix.lang }}:$IMAGE_TAG"
          docker tag "$IMG" "$REGISTRY/devbox-${{ matrix.lang }}:latest"
          docker push "$REGISTRY/devbox-${{ matrix.lang }}:latest"

      - uses: actions/upload-artifact@v4
        with:
          name: image-sizes-${{ matrix.lang }}
          path: metrics/images-*.tsv

  aggregate:
    name: all + runtime
    needs: [base-tool, lang]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build runtime
        run: |
          # buildx 的 --build-arg-file 在老版本插件上不存在（unknown flag）→ 自己解析
          mapfile -t BARGS < <(bash images/scripts/build-args.sh)
          # CI runner 在境外：把 APT_MIRROR 置空，让 setup-apt.sh 保持官方源
          # （镜像里固化国内源的话，Azure 上 apt 会慢到超时）
          BARGS=("${BARGS[@]/APT_MIRROR=*/APT_MIRROR=}")
          docker buildx build --load \
            --file images/runtime/Dockerfile \
            "${BARGS[@]}" \
            --tag "$REGISTRY/devbox-runtime:$IMAGE_TAG" \
            --cache-from "type=gha,scope=runtime" \
            --cache-to "type=gha,mode=max,scope=runtime" \
            .
          docker run --rm "$REGISTRY/devbox-runtime:$IMAGE_TAG"
          size="$(docker image inspect "$REGISTRY/devbox-runtime:$IMAGE_TAG" --format '{{.Size}}')"
          printf 'layer\tsize_bytes\nruntime\t%s\n' "$size" > /tmp/metrics-runtime.tsv
          bash scripts/budget-check.sh --metrics /tmp/metrics-runtime.tsv --layers runtime
          docker push "$REGISTRY/devbox-runtime:$IMAGE_TAG"

      - name: publish runtime latest
        if: github.event_name != 'pull_request'
        run: |
          docker tag "$REGISTRY/devbox-runtime:$IMAGE_TAG" "$REGISTRY/devbox-runtime:latest"
          docker push "$REGISTRY/devbox-runtime:latest"

      - name: build all（六语言总环境）
        run: |
          # buildx 的 --build-arg-file 在老版本插件上不存在（unknown flag）→ 自己解析
          mapfile -t BARGS < <(bash images/scripts/build-args.sh)
          docker buildx build --load \
            --file images/all/Dockerfile \
            --build-arg "BASE_IMAGE=$REGISTRY/devbox-tool:$IMAGE_TAG" \
            "${BARGS[@]}" \
            --tag "$REGISTRY/devbox-all:$IMAGE_TAG" \
            --cache-from "type=gha,scope=all" \
            --cache-to "type=gha,mode=max,scope=all" \
            .
          size="$(docker image inspect "$REGISTRY/devbox-all:$IMAGE_TAG" --format '{{.Size}}')"
          printf 'layer\tsize_bytes\nall\t%s\n' "$size" > /tmp/metrics-all.tsv
          bash scripts/budget-check.sh --metrics /tmp/metrics-all.tsv --layers all
          docker push "$REGISTRY/devbox-all:$IMAGE_TAG"

      - name: publish all latest
        if: github.event_name != 'pull_request'
        run: |
          docker tag "$REGISTRY/devbox-all:$IMAGE_TAG" "$REGISTRY/devbox-all:latest"
          docker push "$REGISTRY/devbox-all:latest"

      - name: 记录体积（all + runtime）
        run: |
          mkdir -p metrics
          printf 'layer\tsize_bytes\n' > metrics/images-all-runtime-$IMAGE_TAG.tsv
          for l in all runtime; do
            s=$(docker image inspect "$REGISTRY/devbox-$l:$IMAGE_TAG" --format '{{.Size}}')
            printf '%s\t%s\n' "$l" "$s" >> metrics/images-all-runtime-$IMAGE_TAG.tsv
          done
          column -t metrics/images-all-runtime-$IMAGE_TAG.tsv

      - uses: actions/upload-artifact@v4
        with:
          name: image-sizes-all-runtime
          path: metrics/images-*.tsv

  budget:
    name: image size budget
    needs: [base-tool, lang, aggregate]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # 一次性收全部体积报告，而不是逐层硬编码 download-artifact。
      # 原来的写法漏了 image-sizes-vue —— 加了第九门语言后预算 job 永远报
      # 「缺少 vue 的 metrics」并 exit 2，而红的原因看着像「超预算」。
      # 用 pattern + merge-multiple，以后再加语言不用改这里。
      - uses: actions/download-artifact@v4
        with:
          pattern: image-sizes-*
          path: metrics/incoming
          merge-multiple: true

      - name: 合并体积并检查预算
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(metrics/incoming/*.tsv)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::没有收到任何体积报告（artifact 名应为 image-sizes-*）"
            exit 1
          fi
          {
            printf 'layer\tsize_bytes\n'
            for file in "${files[@]}"; do
              tail -n +2 "$file"
            done
          } > metrics/images-merged.tsv
          column -t metrics/images-merged.tsv
          bash scripts/budget-check.sh --metrics metrics/images-merged.tsv
