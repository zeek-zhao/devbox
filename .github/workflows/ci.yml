name: ci

# ==================================================================
# 单一流水线：所有触发都跑全量
# ------------------------------------------------------------------
# 触发：
#   pull_request        —— 全量
#   push main           —— 全量
#   push tag v*         —— 全量 + VERSION 与 tag 一致性校验
#   workflow_dispatch   —— 全量（手动）
#
# 为什么不再分档：
#   本仓库已转为公开仓库，GitHub Actions 的分钟数不计量，省测没有收益。
#   之前的「PR 不跑 / main 跑 fast / tag 跑 full」是为了省额度，
#   代价是 PR 阶段的红要等到合并后才暴露。现在没有这个约束了。
#
# 为什么不给 push 开全部分支：
#   同仓分支推送会与 pull_request 重复触发同一次全量。
#   只保留 main + tag，PR 走 pull_request，一次改动只跑一次。
#
# 外部 fork 的 PR：
#   fork PR 拿不到可写的 GITHUB_TOKEN（GitHub 机制），镜像推送必失败，
#   所以 images job 在 fork PR 上跳过。其余 job（719 例 + 格式 + 覆盖）照常跑。
#   这是平台约束，不是省测。
# ==================================================================

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  # 同一分支的新推送取消旧的一次（PR 场景）；main 与 tag 不取消，
  # 避免「合并了但流水线被后来的推送打断」。
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  # 同仓 PR 使用本次 images job 推送的 SHA 镜像；fork PR 没有推送权限，沿用 latest。
  IMAGE_TAG: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && format('sha-{0}', github.sha) || 'latest' }}

jobs:
  # ------------------------------------------------------------------
  # 静态检查：不依赖镜像，最快，失败信息最直接
  # ------------------------------------------------------------------
  static:
    name: 静态检查
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck（脚本层）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          sev="$(grep -E '^SHELLCHECK_SEVERITY=' images/versions.env | cut -d= -f2-)"
          [ -n "$sev" ] || { echo "versions.env 里没有 SHELLCHECK_SEVERITY"; exit 1; }
          git ls-files -z '*.sh' | xargs -0 shellcheck -S "$sev"

      - name: 用例契约完整性（每个用例必须有 run.sh）
        run: |
          fail=0
          while IFS= read -r d; do
            if [ ! -f "$d/run.sh" ]; then
              echo "FAIL: $d 缺 run.sh"; fail=1
            fi
            chmod +x "$d/run.sh" 2>/dev/null || true
          done < <(find . -path './*/examples/*' -mindepth 3 -maxdepth 3 -type d)
          [ "$fail" -eq 0 ] && echo "用例契约 OK"
          exit $fail

      - name: 版本真本自洽（Dockerfile 里不许写死版本号）
        run: bash scripts/check-version-truth.sh

      - name: 文档命令校验（verify 标记）
        run: bash scripts/check-docs.sh

      # 生成物仍由下方门禁校验，避免看板内容绕过数据源。
      - name: 看板与仓库实况一致
        run: bash scripts/check-board-truth.sh

      - name: 看板必须与生成结果一致
        run: |
          bash scripts/build-repo-board.sh
          if ! git diff --exit-code -- docs/进度看板.html; then
            echo "::error::docs/进度看板.html 与生成结果不一致。本地跑 bash scripts/build-repo-board.sh 后提交。"
            exit 1
          fi

      # 发版判据：VERSION 必须与 tag 逐字一致。
      # 少这一条，tag 上的版本号和仓库里写的版本号可以永久不一致而没人发现。
      - name: VERSION 与 tag 一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          want="${GITHUB_REF_NAME#v}"
          have="$(tr -d '[:space:]' < VERSION)"
          echo "tag=${GITHUB_REF_NAME}  VERSION=${have}"
          if [ "$want" != "$have" ]; then
            echo "::error::VERSION（$have）与 tag（$GITHUB_REF_NAME）不一致；先改 VERSION 再打 tag"
            exit 1
          fi

  # ------------------------------------------------------------------
  # 提交身份门禁
  # main 与 tag：全历史必须命中白名单，硬失败
  # pull_request：只查 AI 署名尾巴，外部作者身份只告警（开源惯例）
  # ------------------------------------------------------------------
  authors:
    name: 提交身份
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验提交身份
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            bash scripts/check-authors.sh "${BASE_SHA}..${HEAD_SHA}" --warn-only
          else
            bash scripts/check-authors.sh --all
          fi

  # ------------------------------------------------------------------
  # 覆盖表：一律 --strict
  # 公开仓不需要「明账上的欠债」，pending 一律算失败。
  # ------------------------------------------------------------------
  coverage:
    name: COVERAGE 校验
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 校验用例覆盖表（严格，不允许 pending）
        run: bash scripts/coverage-check.sh --strict

  # ------------------------------------------------------------------
  # 镜像可用性探测
  # 探测 latest 作为基线（fork PR 仍使用它）；同仓 PR 随后构建 SHA 镜像供测试使用。
  # ------------------------------------------------------------------
  probe:
    name: 镜像可用性
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    needs: [static, coverage]
    outputs:
      ready: ${{ steps.p.outputs.ready }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 探测 devbox-cpp 镜像是否存在
        id: p
        run: |
          if docker manifest inspect "$REGISTRY/devbox-cpp:latest" > /dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "镜像已就绪：$REGISTRY/devbox-cpp:latest"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::镜像 $REGISTRY/devbox-cpp:latest 不存在。先跑一次 images workflow（push main 或手动触发）"
            exit 1
          fi

  # ------------------------------------------------------------------
  # 格式化：一门语言一个 job。
  # 一门一个 job 而不是一个 job 跑八门：八门串行要拉 11 GB 镜像，
  # 并行则墙钟约等于最慢的那一门。
  # ------------------------------------------------------------------
  fmt:
    name: 格式-${{ matrix.lang }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    needs: [probe, images]
    if: always() && needs.probe.outputs.ready == 'true' && (needs.images.result == 'success' || needs.images.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        lang: [c, cpp, go, rust, shell, python, java, vue]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 拉取语言镜像
        run: |
          # C 没有独立镜像层，复用 devbox-cpp。映射真本是 images/lang-images.tsv，
          # 与 scripts/run-example.sh / scripts/fmt.sh 读的是同一个文件。
          layer="$(awk -F'\t' -v k='${{ matrix.lang }}' '$1 == k { print $2; exit }' images/lang-images.tsv)"
          docker pull "$REGISTRY/devbox-${layer:-${{ matrix.lang }}}:$IMAGE_TAG"

      - name: 格式化检查（fmt-check）
        run: TAG="$IMAGE_TAG" bash scripts/fmt.sh --check --lang ${{ matrix.lang }}

  # ------------------------------------------------------------------
  # 全量用例：一门语言一个 job。
  # fail-fast 关掉 —— 要知道「到底坏了几门」，而不是第一门坏了就停。
  # ------------------------------------------------------------------
  examples:
    name: 用例-${{ matrix.lang }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    needs: [probe, images]
    if: always() && needs.probe.outputs.ready == 'true' && (needs.images.result == 'success' || needs.images.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        lang: [c, cpp, go, rust, shell, python, java, vue]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 拉取语言镜像
        run: |
          layer="$(awk -F'\t' -v k='${{ matrix.lang }}' '$1 == k { print $2; exit }' images/lang-images.tsv)"
          docker pull "$REGISTRY/devbox-${layer:-${{ matrix.lang }}}:$IMAGE_TAG"

      - name: 跑该语言全部用例
        run: TAG="$IMAGE_TAG" bash scripts/run-example.sh ${{ matrix.lang }} --all

  # ------------------------------------------------------------------
  # 数据库轨道：自己起 Compose 栈，runner 与其它轨道不同
  # （db/scripts/run-all.sh 负责 up → wait-ready → 逐例跑 → down）
  # ------------------------------------------------------------------
  examples-db:
    name: 用例-db
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: 跑数据库轨道全部用例
        run: bash db/scripts/run-all.sh

  # ------------------------------------------------------------------
  # shared/ 工具箱自测（三个库依赖 bats + jq + yq，都在 shell 层里）
  # ------------------------------------------------------------------
  shared:
    name: shared 工具自测
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    needs: [probe, images]
    if: always() && needs.probe.outputs.ready == 'true' && (needs.images.result == 'success' || needs.images.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 拉取 shell 镜像
        run: docker pull "$REGISTRY/devbox-shell:$IMAGE_TAG"

      - name: README 函数索引与代码一致
        run: bash scripts/check-shared-index.sh

      - name: 跑 shared/tests
        run: TAG="$IMAGE_TAG" bash shared/tests/run.sh

  # ------------------------------------------------------------------
  # release 工具自测（shared/release，零依赖的 Node 工具）
  # 不起容器：runner 自带 node，测试也不联网。
  # ------------------------------------------------------------------
  release:
    name: release 工具自测
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 跑 shared/release 测试
        run: |
          node --version
          cd shared/release && node --test test/*.test.js

  # ------------------------------------------------------------------
  # 镜像重建 + 体积预算：直接复用 images.yml，不复制那 200 行。
  # 先构建本次镜像，再由 fmt/examples 使用其 SHA tag；fork PR 跳过构建并继续使用 latest。
  #
  # fork PR 跳过：拿不到可写的 GITHUB_TOKEN，推送必失败。
  # ------------------------------------------------------------------
  images:
    name: 镜像重建
    needs: [probe]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/images.yml
    secrets: inherit

  # ------------------------------------------------------------------
  # 排障演练 labs（M11-W3-01 人工批次新增；2026-11-12 #390 维护者授权改路径）：
  # 真跑全部 <lang>/examples/T-*/run.sh——演练已由 <lang>/labs/ 迁入 examples/，
  # 由本 job 独占真跑，用例 runner 的 --all 已显式跳过 T-* 前缀。
  # 门禁变更理由：路径迁移是本卡目的本身，判定松紧不变（不新增/删除任何被跑对象）。
  # 镜像用本次提交的 sha-<commit> tag（KI-08，不用 :latest），由上面 images job 同批构建推送。
  #
  # 等待策略（2026-11-07 修，见 PR 描述）：整批按 layer 去重、共用 1500s（25min）全局预算，
  # 与「单个 lab 等待上限」一致，够 images.yml 并行构建 11 层镜像；超时即判 image_not_ready 并失败。
  # 旧逻辑在循环内逐 lab 各轮询 50×30s=25min，
  # 而静态检查失败会让 probe/images 被 skip、sha 镜像根本不会被构建，
  # 8 个有镜像层的 lab 便串行空转最多 200min（run 42333953308 / 42332035612 卡 2h+）。
  # 本次修复**不放宽判定**：镜像未就绪仍然红，只是把无意义空转变成快速明确失败。
  #
  # db 走 compose（同 examples-db 约定）；对外部镜像源瞬时故障：首次失败留档后
  # 重试 1 次 + 60s 退避（#264 E3 拍板，不把「重试后绿」显示成一次干净的绿）。
  # ------------------------------------------------------------------
  labs:
    name: 排障演练-labs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [probe, images]
    if: always() && needs.probe.outputs.ready == 'true' && (needs.images.result == 'success' || needs.images.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - name: 真跑全部 lab
        env:
          SHA_TAG: sha-${{ github.sha }}
        run: |
          set -uo pipefail
          fail=0
          for run_sh in */examples/T-*/run.sh; do
            lang="${run_sh%%/*}"
            if [ "$lang" = "db" ]; then
              echo "==> $run_sh (compose)"
              for attempt in 1 2; do
                rc=0
                bash db/scripts/up.sh && bash db/scripts/wait-ready.sh && bash "$run_sh" || rc=$?
                if [ "$rc" = 0 ]; then echo "[labs] PASS $run_sh"; break; fi
                echo "[labs] attempt=$attempt 首次/前次失败留档：rc=$rc（上方日志原样保留）"
                if [ "$attempt" = 2 ]; then echo "[labs] FAIL $run_sh"; fail=1; else
                  echo "[labs] infra_transient 分类：60s 退避后重试 1 次"; sleep 60
                  bash db/scripts/down.sh || true
                fi
              done
              bash db/scripts/down.sh || true
              continue
            fi
            layer="$(awk -F'\t' -v k="$lang" '$1 == k { print $2; exit }' images/lang-images.tsv)"
            if [ -z "$layer" ]; then
              # shared 等无镜像层的轨道：runner 直跑（bash/curl/python3 宿主自带），不等待不存在的镜像（#276）
              echo "==> $run_sh (无镜像层映射，runner 直跑)"
              if bash "$run_sh"; then echo "[labs] PASS $run_sh"; else echo "[labs] FAIL $run_sh"; fail=1; fi
              continue
            fi
            layer="${layer:-$lang}"
            image="$REGISTRY/devbox-${layer}:${SHA_TAG}"
            echo "==> $run_sh (镜像 $image)"
            if docker run --rm -v "$PWD":/w -w /w -e TAG="$SHA_TAG" "$image" bash -lc "bash $run_sh"; then
              echo "[labs] PASS $run_sh"
            else
              echo "[labs] FAIL $run_sh"; fail=1
            fi
          done
          [ "$fail" = 0 ] || exit 1
