name: ci

# ==================================================================
# 日常流水线（fast 档）—— 墙钟预算 180 秒
# ------------------------------------------------------------------
# 分级策略（详见 docs/02-CI分级.md）：
#
#   ① pull_request   —— 不触发任何流水线（省 GitHub 额度）
#   ② push main/dev  —— 本文件（fast）：只跑静态门禁，不跑用例矩阵
#   ③ push tag v*    —— full.yml：608 个用例 + 镜像重建 + 体积预算
#
# 为什么 PR 阶段零 CI：
#   判定标准是「全量用例 + 8 门格式化 + 覆盖表自洽」，跑一次十分钟。
#   给每个中间状态都烧一次额度，收益只是「早十分钟知道红了」，
#   而代价是并行派 N 张卡时同时烧 N 份。所以 PR 阶段不跑，
#   改由本地 scripts/pre-merge.sh 在合并前一次性跑全量（等价 fast+full）。
#
# 为什么 fast 档不含用例：
#   用例矩阵要拉 8 个镜像、go 一门就 544 秒，天然超预算。
#   它已经在 pre-merge 里跑过了，main 上再跑一遍只是重复确认。
#   main 上留的是「快、且能挡住明显事故」的五项：
#     static（shellcheck/契约/版本真本/文档命令）、coverage、probe、fmt 8 门、shared。
#
# 为什么 fmt 留在 fast 档：
#   格式化漂移是并行派卡最常见的事故（两张卡各改一半，合起来就不达标），
#   而它便宜。丢了它，main 上的格式会慢慢烂掉，而发现时已经是几百个文件。
# ==================================================================

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  # 用例与格式化跑的是 images workflow 推上来的 latest；
  # 改了 Dockerfile 时先等 images 跑完再手动触发，见 docs/01-镜像体系.md
  IMAGE_TAG: latest
  # fast 档墙钟预算（秒）。守卫 job 超了只发 ::warning::，不判红 ——
  # 硬红会让「runner 慢一点」变成「代码有问题」，噪音盖过信号。
  FAST_BUDGET_SECONDS: 180

jobs:
  static:
    name: 静态检查
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck（脚本层）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          sev="$(grep -E '^SHELLCHECK_SEVERITY=' images/versions.env | cut -d= -f2-)"
          [ -n "$sev" ] || { echo "versions.env 里没有 SHELLCHECK_SEVERITY"; exit 1; }
          git ls-files -z '*.sh' | xargs -0 shellcheck -S "$sev"

      - name: 用例契约完整性（每个用例必须有 run.sh，有输出就必须有 expected.txt）
        run: |
          fail=0
          while IFS= read -r d; do
            id="$(basename "$d")"
            if [ ! -f "$d/run.sh" ]; then
              echo "FAIL: $d 缺 run.sh"; fail=1
            fi
            chmod +x "$d/run.sh" 2>/dev/null || true
          done < <(find . -path './*/examples/*' -mindepth 3 -maxdepth 3 -type d)
          [ "$fail" -eq 0 ] && echo "用例契约 OK"
          exit $fail

      - name: 版本真本自洽（Dockerfile 里不许写死版本号）
        run: bash scripts/check-version-truth.sh

      # 文档里的命令会随 make 目标改名而静默失效，这条让 CI 替人敲一遍。
      # 不依赖镜像，所以放在 static 里而不是 fmt 里。
      - name: 文档命令校验（verify 标记）
        run: bash scripts/check-docs.sh

  coverage:
    name: COVERAGE 校验
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: 校验用例覆盖表
        run: bash scripts/coverage-check.sh

  # ------------------------------------------------------------------
  # 镜像可用性探测：镜像还没建时，fmt 直接 pull 会红，
  # 把「镜像还没建」误报成「格式不达标」。所以先探测，探测不到就跳过，
  # 但仓库变量 REQUIRE_IMAGES=true 时硬红（M1 完成后应当设成 true）。
  # ------------------------------------------------------------------
  probe:
    name: 镜像可用性
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      packages: read
    needs: [static, coverage]
    outputs:
      ready: ${{ steps.p.outputs.ready }}
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 探测 devbox-cpp 镜像是否存在
        id: p
        run: |
          if docker manifest inspect "$REGISTRY/devbox-cpp:$IMAGE_TAG" > /dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "镜像已就绪：$REGISTRY/devbox-cpp:$IMAGE_TAG"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            if [ "${{ vars.REQUIRE_IMAGES }}" = "true" ]; then
              echo "::error::镜像 $REGISTRY/devbox-cpp:$IMAGE_TAG 不存在，但仓库变量 REQUIRE_IMAGES=true。先跑 images workflow"
              exit 1
            fi
            echo "::warning::镜像尚未构建，本次跳过格式化检查。M1 完成后请把仓库变量 REQUIRE_IMAGES 设为 true"
          fi

  # ------------------------------------------------------------------
  # 格式化检查：一门语言一个 job。
  # 一门一个 job 而不是一个 job 跑八门：八门串行要拉 11 GB 镜像，
  # 并行则墙钟约等于最慢的那一门。fast 档的 180 秒预算靠的就是这个。
  # ------------------------------------------------------------------
  fmt:
    name: 格式-${{ matrix.lang }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      packages: read
    needs: [probe]
    if: needs.probe.outputs.ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        lang: [c, cpp, go, rust, shell, python, java, vue]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 拉取语言镜像
        run: |
          # C 没有独立镜像层，复用 devbox-cpp。映射真本是 images/lang-images.tsv，
          # 与 scripts/run-example.sh / scripts/fmt.sh 读的是同一个文件。
          layer="$(awk -F'\t' -v k='${{ matrix.lang }}' '$1 == k { print $2; exit }' images/lang-images.tsv)"
          docker pull "$REGISTRY/devbox-${layer:-${{ matrix.lang }}}:$IMAGE_TAG"

      - name: 格式化检查（fmt-check）
        run: TAG="$IMAGE_TAG" bash scripts/fmt.sh --check --lang ${{ matrix.lang }}

  # ------------------------------------------------------------------
  # shared/ 工具箱自测（见 shared/README.md）
  # 三个库依赖 bats + jq + yq，这三个都装在 shell 层里，所以只拉 shell 镜像，
  # 宿主什么都不用装 —— 和用例那套「判定逻辑只跑在容器里」保持一致。
  # ------------------------------------------------------------------
  shared:
    name: shared 工具自测
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      packages: read
    needs: [probe]
    if: needs.probe.outputs.ready == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 拉取 shell 镜像
        run: docker pull "$REGISTRY/devbox-shell:$IMAGE_TAG"

      - name: README 函数索引与代码一致
        run: bash scripts/check-shared-index.sh

      - name: 跑 shared/tests
        run: TAG="$IMAGE_TAG" bash shared/tests/run.sh

  # ------------------------------------------------------------------
  # release 工具自测（shared/release，零依赖的 Node 工具）
  # 不起容器：runner 自带 node，测试也不联网（临时目录里 git init 造仓库）。
  # 它管的是「打 tag / 生成 CHANGELOG」这条链路 —— 坏了不会立刻被发现，
  # 只会在某次发版时炸，所以放进 fast 档每次 push main 都验一遍。
  # ------------------------------------------------------------------
  release:
    name: release 工具自测
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: 跑 shared/release 测试
        run: |
          node --version
          cd shared/release && node --test test/*.test.js

  # ------------------------------------------------------------------
  # 墙钟预算守卫：读的是 runner 上真实的时间戳（含排队），不是各 job 自报。
  # 只发 ::warning::，不判红 —— 它的作用是「让预算漂移看得见」，不是拦合并。
  # ------------------------------------------------------------------
  wallclock:
    name: 墙钟预算
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    if: always()
    needs: [static, coverage, probe, fmt, shared, release]
    permissions:
      contents: read
      actions: read
    steps:
      - name: 统计本轮墙钟
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          started="$(gh api "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" \
                       --jq '[.jobs[].started_at | select(. != null)] | min' 2>/dev/null || true)"
          if [ -z "$started" ] || [ "$started" = "null" ]; then
            echo "::warning::取不到本轮 job 起始时间，跳过墙钟统计"
            exit 0
          fi
          start_epoch="$(date -u -d "$started" +%s)"
          elapsed=$(( $(date -u +%s) - start_epoch ))
          echo "fast 档墙钟：${elapsed}s（预算 ${FAST_BUDGET_SECONDS}s）"
          if [ "$elapsed" -gt "$FAST_BUDGET_SECONDS" ]; then
            echo "::warning::fast 档耗时 ${elapsed}s 已超预算 ${FAST_BUDGET_SECONDS}s —— 先看是哪个 job 变慢，再决定是缩矩阵还是放宽预算"
          fi
